<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Error (500) — MU Magic Masala</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FDFBF7;
      color: #2A160A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #E7E5E4;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .icon-box {
      width: 64px;
      height: 64px;
      background: #FEF3C7;
      border: 1px solid #FDE68A;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 700;
      color: #92400E;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #1C1917;
    }
    p {
      font-size: 14px;
      color: #57534E;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      background: #8B1E1E;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #731818;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">500</div>
    <h1>Something Went Wrong</h1>
    <p>We are experiencing a temporary issue processing this request. Our technical team has been automatically alerted and is looking into it.</p>
    <a href="/" class="btn">Return to Homepage</a>
  </div>
</body>
</html>
