<aside class="w-full lg:w-64 flex-shrink-0">
  <div class="bg-white rounded-2xl border border-stone-100 p-5 shadow-xs sticky top-24">
    <div class="flex items-center gap-3 pb-5 mb-5 border-b border-stone-100">
      <div class="w-12 h-12 rounded-full bg-turmeric/20 text-masala-red flex items-center justify-center font-bold text-lg border border-turmeric/30 flex-shrink-0">
        {{ user.first_name|default:user.username|slice:":1"|upper }}
      </div>
      <div class="truncate">
        <h3 class="font-bold text-stone-900 text-sm truncate">{{ user.get_full_name|default:user.username }}</h3>
        <p class="text-xs text-stone-400 truncate">{{ user.email }}</p>
      </div>
    </div>

    <nav class="space-y-1 text-sm font-medium">
      <a href="{% url 'accounts:dashboard' %}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-colors {% if request.resolver_match.url_name == 'dashboard' %}bg-masala-red text-white shadow-xs{% else %}text-stone-700 hover:bg-cream hover:text-masala-red{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span>Dashboard</span>
      </a>

      <a href="{% url 'accounts:order_list' %}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-colors {% if 'order' in request.resolver_match.url_name %}bg-masala-red text-white shadow-xs{% else %}text-stone-700 hover:bg-cream hover:text-masala-red{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        <span>My Orders</span>
      </a>

      <a href="{% url 'accounts:address_list' %}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-colors {% if 'address' in request.resolver_match.url_name %}bg-masala-red text-white shadow-xs{% else %}text-stone-700 hover:bg-cream hover:text-masala-red{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span>Addresses</span>
      </a>

      <a href="{% url 'accounts:wishlist' %}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-colors {% if request.resolver_match.url_name == 'wishlist' %}bg-masala-red text-white shadow-xs{% else %}text-stone-700 hover:bg-cream hover:text-masala-red{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
        <span>Wishlist</span>
      </a>

      <a href="{% url 'accounts:profile_edit' %}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-colors {% if request.resolver_match.url_name == 'profile_edit' %}bg-masala-red text-white shadow-xs{% else %}text-stone-700 hover:bg-cream hover:text-masala-red{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span>Profile Settings</span>
      </a>

      <a href="{% url 'accounts:password_change' %}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-colors {% if request.resolver_match.url_name == 'password_change' %}bg-masala-red text-white shadow-xs{% else %}text-stone-700 hover:bg-cream hover:text-masala-red{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        <span>Change Password</span>
      </a>

      <div class="pt-3 mt-3 border-t border-stone-100">
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button type="submit" class="w-full flex items-center gap-3 px-3.5 py-2 rounded-xl text-stone-500 hover:bg-red-50 hover:text-red-700 transition-colors text-left text-sm font-medium">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            <span>Sign Out</span>
          </button>
        </form>
      </div>
    </nav>
  </div>
</aside>
